<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Task Database</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <p class="label">SQLITE DATABASE PROJECT</p>
      <h1>My tasks</h1>
      <p>Add a task. It is saved in the SQLite database.</p>

      <form id="task-form">
        <input id="task-input" type="text" maxlength="100" placeholder="Example: Learn databases" required />
        <button type="submit">Add task</button>
      </form>

      <p id="message" aria-live="polite"></p>
      <ul id="task-list"></ul>
    </main>
    <script src="script.js"></script>
  </body>
</html>
